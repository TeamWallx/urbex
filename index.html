<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeroLinkXZ Dashboard - Qwen 2.5 & Gemini Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #080a0f;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 12px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #1a2332;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #00ffcc;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
    }

    .top-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .mode-toggle {
      display: flex;
      background: #111622;
      border: 1px solid #2a364f;
      border-radius: 4px;
      overflow: hidden;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .mode-btn.active {
      background: #00ffcc;
      color: #080a0f;
      font-weight: bold;
    }

    input, select, button {
      background: #111622;
      border: 1px solid #2a364f;
      color: #e6edf3;
      padding: 6px 10px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.85rem;
    }

    input:focus, select:focus {
      outline: 1px solid #00ffcc;
      border-color: #00ffcc;
    }

    button.action-btn {
      cursor: pointer;
      background: #1a2332;
      color: #00ffcc;
      border-color: #2a364f;
      transition: 0.2s;
    }

    button.action-btn:hover {
      background: #2a364f;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
    }

    .config-strip {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #0a0d14;
      padding: 6px 10px;
      border: 1px solid #1a2332;
      border-radius: 4px;
      margin-top: 8px;
    }

    .config-strip input { flex: 1; }

    .main-container {
      display: flex;
      flex: 1;
      gap: 12px;
      margin: 12px 0;
      overflow: hidden;
    }

    #terminal-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #030407;
      border: 1px solid #1a2332;
      border-radius: 4px;
      padding: 10px;
      position: relative;
    }

    #terminal {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #030407;
    }
    ::-webkit-scrollbar-thumb {
      background: #1a2332;
      border-radius: 3px;
    }

    .line { line-height: 1.4; word-break: break-word; white-space: pre-wrap; font-size: 0.9rem; }
    .user { color: #58a6ff; }
    .bot { color: #7ee787; }
    .sys { color: #8b949e; font-style: italic; }
    .error { color: #f85149; }

    /* Game Hub Section */
    #game-hub {
      flex: 1.1;
      display: flex;
      flex-direction: column;
      background: #030407;
      border: 1px solid #1a2332;
      border-radius: 4px;
      padding: 10px;
      gap: 8px;
    }

    .game-controls {
      display: flex;
      gap: 8px;
    }

    .game-controls select { flex: 1; }

    iframe {
      width: 100%;
      flex: 1;
      border: 1px solid #1a2332;
      border-radius: 4px;
      background: #000;
    }

    .input-bar { display: flex; gap: 8px; }
    .input-bar input { flex: 1; }

    @media (max-width: 900px) {
      .main-container { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header>
    <h1>NeroLinkXZ</h1>
    <div class="top-controls">
      <div class="mode-toggle">
        <button id="btnOllamaMode" class="mode-btn active" onclick="switchMode('ollama')">Ollama (Localtunnel)</button>
        <button id="btnOpenRouterMode" class="mode-btn" onclick="switchMode('openrouter')">OpenRouter (Gemini)</button>
      </div>
      
      <!-- Ollama Models Dropdown -->
      <select id="ollamaModelSelect" style="display: block;">
        <option value="qwen2.5:3b" selected>Qwen 2.5 3B (Default)</option>
        <option value="qwen2.5-coder:3b">Qwen 2.5 Coder 3B</option>
        <option value="qwen2.5:1.5b">Qwen 2.5 1.5B (Ultra-Fast)</option>
        <option value="qwen2.5:7b">Qwen 2.5 7B</option>
      </select>

      <!-- OpenRouter Gemini Models Dropdown -->
      <select id="openRouterModelSelect" style="display: none;">
        <option value="google/gemini-2.0-flash-001" selected>Gemini 2.0 Flash</option>
        <option value="google/gemini-1.5-flash">Gemini 1.5 Flash</option>
        <option value="google/gemini-1.5-pro">Gemini 1.5 Pro</option>
        <option value="google/gemini-2.0-pro-exp-02-05:free">Gemini 2.0 Pro Exp (Free)</option>
      </select>

      <button class="action-btn" onclick="saveSettings()">SAVE SETTINGS</button>
    </div>
  </header>

  <div class="config-strip" id="configStrip">
    <span id="configLabel" style="font-size: 0.8rem; color: #00ffcc;">LT Endpoint:</span>
    <input type="text" id="endpointInput" placeholder="https://nine-clouds-appear.loca.lt" />
  </div>

  <div class="main-container">
    <!-- Terminal View -->
    <div id="terminal-container">
      <div id="terminal"></div>
    </div>

    <!-- Game Hub View -->
    <div id="game-hub">
      <div class="game-controls">
        <select id="gameSelect" onchange="loadGame()">
          <option value="">-- Select Game Site / Emulator --</option>
          <optgroup label="🎮 Emulators & Retro Hubs">
            <option value="https://emulatoros.github.io/">EmulatorOS (Multi-System Retro)</option>
            <option value="https://www.retrogames.cc/">RetroGames.cc (Arcade & Console)</option>
            <option value="https://dustinbrett.com/">daedalOS (Web OS & Games)</option>
          </optgroup>

          <optgroup label="🕹️ Popular Web Games">
            <option value="https://eaglercraft.com/">Eaglercraft (Minecraft Web)</option>
            <option value="https://slopegame.io/">Slope Game</option>
            <option value="https://play2048.co/">2048 Original</option>
            <option value="https://hextris.io/">Hextris</option>
            <option value="https://paper-io.com/">Paper.io 2</option>
            <option value="https://cookieclicker.ee/">Cookie Clicker</option>
          </optgroup>

          <optgroup label="👾 Arcade Classics">
            <option value="https://juliensimon.github.io/browser-games/pac-man/">Pac-Man Classic</option>
            <option value="https://juliensimon.github.io/browser-games/space-invaders/">Space Invaders</option>
            <option value="https://juliensimon.github.io/browser-games/asteroids/">Asteroids</option>
            <option value="https://juliensimon.github.io/browser-games/pong/">Pong</option>
          </optgroup>
        </select>
        <button class="action-btn" onclick="toggleFullscreen()">FULLSCREEN</button>
      </div>
      <iframe id="gameFrame" src="about:blank" allowfullscreen></iframe>
    </div>
  </div>

  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Type prompt here... (or /clear)" onkeydown="if(event.key==='Enter') handleSend()" />
    <button class="action-btn" onclick="handleSend()">SEND</button>
  </div>

  <script>
    const DEFAULT_OLLAMA_URL = "https://nine-clouds-appear.loca.lt";
    const HARDCODED_OR_KEY = "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";

    let currentMode = 'ollama';

    const terminal = document.getElementById('terminal');
    const userInput = document.getElementById('userInput');
    const endpointInput = document.getElementById('endpointInput');
    const configLabel = document.getElementById('configLabel');
    const gameFrame = document.getElementById('gameFrame');

    const btnOllamaMode = document.getElementById('btnOllamaMode');
    const btnOpenRouterMode = document.getElementById('btnOpenRouterMode');
    const ollamaModelSelect = document.getElementById('ollamaModelSelect');
    const openRouterModelSelect = document.getElementById('openRouterModelSelect');

    window.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      printLine('[NEROLINKXZ ENGINE ONLINE]', 'sys');
      printLine('Default Model: qwen2.5:3b via Localtunnel', 'sys');
      printLine('Type /clear to reset history.', 'sys');
    });

    function switchMode(mode) {
      currentMode = mode;
      localStorage.setItem('nerolink_mode', mode);

      if (mode === 'ollama') {
        btnOllamaMode.classList.add('active');
        btnOpenRouterMode.classList.remove('active');
        ollamaModelSelect.style.display = 'block';
        openRouterModelSelect.style.display = 'none';
        configLabel.innerText = "LT Endpoint:";
        endpointInput.placeholder = "https://nine-clouds-appear.loca.lt";
        endpointInput.value = localStorage.getItem('ollama_endpoint') || DEFAULT_OLLAMA_URL;
        printLine(`Active Mode: [Ollama Localtunnel] -> Target: ${ollamaModelSelect.value}`, 'sys');
      } else {
        btnOpenRouterMode.classList.add('active');
        btnOllamaMode.classList.remove('active');
        ollamaModelSelect.style.display = 'none';
        openRouterModelSelect.style.display = 'block';
        configLabel.innerText = "OpenRouter Key:";
        endpointInput.placeholder = "sk-or-v1-...";
        endpointInput.value = localStorage.getItem('openrouter_key') || HARDCODED_OR_KEY;
        printLine(`Active Mode: [OpenRouter Gemini] -> Target: ${openRouterModelSelect.value}`, 'sys');
      }
    }

    function loadSettings() {
      const savedMode = localStorage.getItem('nerolink_mode') || 'ollama';
      const savedOllamaModel = localStorage.getItem('ollama_model') || 'qwen2.5:3b';

      ollamaModelSelect.value = savedOllamaModel;
      switchMode(savedMode);
    }

    function saveSettings() {
      if (currentMode === 'ollama') {
        const val = endpointInput.value.trim() || DEFAULT_OLLAMA_URL;
        localStorage.setItem('ollama_endpoint', val);
        localStorage.setItem('ollama_model', ollamaModelSelect.value);
        printLine(`Saved Ollama Endpoint: ${val} (${ollamaModelSelect.value})`, 'sys');
      } else {
        const val = endpointInput.value.trim() || HARDCODED_OR_KEY;
        localStorage.setItem('openrouter_key', val);
        printLine(`Saved OpenRouter API Key.`, 'sys');
      }
    }

    function printLine(text, type = 'sys') {
      const el = document.createElement('div');
      el.className = `line ${type}`;
      el.innerText = text;
      terminal.appendChild(el);
      terminal.scrollTop = terminal.scrollHeight;
      return el;
    }

    function loadGame() {
      const url = document.getElementById('gameSelect').value;
      if (url) {
        gameFrame.src = url;
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        gameFrame.requestFullscreen().catch(err => {
          printLine(`Fullscreen error: ${err.message}`, 'error');
        });
      } else {
        document.exitFullscreen();
      }
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      if (text === '/clear') {
        terminal.innerHTML = '';
        userInput.value = '';
        return;
      }

      printLine(`$ ${text}`, 'user');
      userInput.value = '';

      if (currentMode === 'ollama') {
        await sendOllamaPrompt(text);
      } else {
        await sendOpenRouterPrompt(text);
      }
    }

    async function sendOllamaPrompt(promptText) {
      let baseUrl = localStorage.getItem('ollama_endpoint') || endpointInput.value.trim() || DEFAULT_OLLAMA_URL;
      baseUrl = baseUrl.replace(/\/$/, ""); 
      const selectedModel = ollamaModelSelect.value;

      const loader = printLine(`[Ollama] Processing prompt with ${selectedModel}...`, 'sys');

      try {
        const response = await fetch(`${baseUrl}/api/generate`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "bypass-tunnel-reminder": "true" 
          },
          body: JSON.stringify({
            model: selectedModel,
            prompt: promptText,
            stream: false
          })
        });

        loader.remove();

        if (!response.ok) {
          printLine(`Ollama Error (${response.status}): Could not reach endpoint (${baseUrl}). Make sure 'ollama run ${selectedModel}' and localtunnel are active.`, 'error');
          return;
        }

        const data = await response.json();
        const reply = data.response || '[No content returned]';
        printLine(reply, 'bot');

      } catch (err) {
        loader.remove();
        printLine(`Connection Failure: ${err.message}`, 'error');
      }
    }

    async function sendOpenRouterPrompt(promptText) {
      let apiKey = localStorage.getItem('openrouter_key') || endpointInput.value.trim() || HARDCODED_OR_KEY;
      const selectedModel = openRouterModelSelect.value;

      const loader = printLine(`[OpenRouter] Sending request to ${selectedModel}...`, 'sys');

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey.trim()}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: selectedModel,
            messages: [{ role: "user", content: promptText }]
          })
        });

        loader.remove();

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          printLine(`OpenRouter Error (${response.status}): ${errData.error?.message || 'API call failed'}`, 'error');
          return;
        }

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || '[No content returned]';
        printLine(reply, 'bot');

      } catch (err) {
        loader.remove();
        printLine(`Connection Failure: ${err.message}`, 'error');
      }
    }
  </script>
</body>
</html>
